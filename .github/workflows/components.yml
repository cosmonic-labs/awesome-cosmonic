# Builds the standalone Rust components and publishes them to GHCR.
#
# The companion to mcp-servers.yml, for projects that are not MCP servers and
# do not sit under a single directory. Unlike the MCP servers, these carry a
# `wit/` tree, so the fetch a reader runs is run here too.
#
# It resolves to very little today: sandboxed-webhook's world is empty because
# wstd carries its bindings, task-manager's `wit/deps` is committed, and the p3
# components have no `wit/` tree at all. The step is here so that the day one of
# these does depend on a fetched package, CI exercises the same path the README
# tells a reader to take, rather than quietly passing on a vendored copy.
name: components

on:
  push:
    branches: [main]
    tags: ["*-v*"]
    paths:
      - "components/sandboxed-webhook/**"
      - "components/minimal-agent/**"
      # The registry map every build's WIT fetch reads (cosmonic:* from ghcr.io).
      - "wit/wkg-registries.toml"
      - "workload-examples/task-manager/**"
      - "workload-examples/first-flight/**"
      - "workload-examples/qrcode/**"
      - "workload-examples/csv-tidy/**"
      - "workload-examples/passphrase/**"
      - "workload-examples/request-bin/**"
      - ".github/workflows/components.yml"
  pull_request:
    paths:
      - "components/sandboxed-webhook/**"
      - "components/minimal-agent/**"
      # The registry map every build's WIT fetch reads (cosmonic:* from ghcr.io).
      - "wit/wkg-registries.toml"
      - "workload-examples/task-manager/**"
      - "workload-examples/first-flight/**"
      - "workload-examples/qrcode/**"
      - "workload-examples/csv-tidy/**"
      - "workload-examples/passphrase/**"
      - "workload-examples/request-bin/**"
      - ".github/workflows/components.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for the same reason as mcp-servers.yml, with one nuance. Where a
  # component's WASI version comes from a crate (sandboxed-webhook pins
  # `wasip2` in Cargo.lock, and sits at 0.2.12 either way), the toolchain does
  # not move the version. It still moves the *set*: building on 1.97.1 adds
  # seven `wasi:cli` stdio and terminal imports that the published builds never
  # requested. That list is what an operator reviews before granting anything,
  # so it should move when someone decides it moves. Bump deliberately.
  RUST_VERSION: "1.97.1"
  # Adds the second tag of a publish (`latest`) to the manifest the first push
  # wrote, without pushing again. `wash oci push` stamps a creation time into
  # every manifest it writes, so pushing once per tag gave each tag its own
  # digest, and only the last one was attested. Pinned by version and by the
  # SHA-256 of the release archive, from the release's checksums file.
  ORAS_VERSION: "1.3.6"
  ORAS_SHA256: "66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0"
  # wasm-opt, for the size-optimized build (minimal-agent-small). Its passes
  # decide the published bytes as much as rustc does, so it is pinned by
  # release and by the SHA-256 of the archive, from the release's .sha256 file.
  BINARYEN_VERSION: "133"
  BINARYEN_SHA256: "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The cosmonic:* packages resolve through the repository's registry map, for
    # the fetch and for `wash build`, which fetches again. It repeats the wasi
    # mapping, so components without cosmonic packages are unaffected.
    env:
      WKG_CONFIG_FILE: ${{ github.workspace }}/wit/wkg-registries.toml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: first-flight
            path: workload-examples/first-flight
            # Published under a bare name rather than the components/ prefix
            # the others use, and the Launchpad catalog pins that path.
            image: ghcr.io/cosmonic-labs/first-flight
            expect: "export wasi:http/incoming-handler"
          - name: sandboxed-webhook
            path: components/sandboxed-webhook
            image: ghcr.io/cosmonic-labs/components/sandboxed-webhook
            # Losing this export is a deployment failure with an opaque
            # message, so it is worth catching as a build failure with an
            # obvious one.
            expect: "export wasi:http/incoming-handler"
          - name: task-manager
            path: workload-examples/task-manager
            image: ghcr.io/cosmonic-labs/components/task-manager
            expect: "export wasi:http/incoming-handler"
          - name: qrcode
            path: workload-examples/qrcode
            image: ghcr.io/cosmonic-labs/components/qrcode
            expect: "export wasi:http/incoming-handler"
          - name: request-bin
            path: workload-examples/request-bin
            image: ghcr.io/cosmonic-labs/components/request-bin
            expect: "export wasi:http/incoming-handler"
          # WASI p3: these export `handler`, not the p2 `incoming-handler`.
          - name: csv-tidy
            path: workload-examples/csv-tidy
            image: ghcr.io/cosmonic-labs/components/csv-tidy
            expect: "export wasi:http/handler"
          - name: passphrase
            path: workload-examples/passphrase
            image: ghcr.io/cosmonic-labs/components/passphrase
            expect: "export wasi:http/handler"
          - name: minimal-agent
            path: components/minimal-agent
            image: ghcr.io/cosmonic-labs/components/minimal-agent
            # A host drives it through the typed run; it serves no HTTP.
            expect: "export cosmonic:agent/run@0.4.2"
          # The same source as minimal-agent, built for size: see "Build the
          # size-optimized component" below. A separate package, so that
          # minimal-agent stays exactly what `wash build` produces.
          - name: minimal-agent-small
            path: components/minimal-agent
            image: ghcr.io/cosmonic-labs/components/minimal-agent-small
            optimize: size
            expect: "export cosmonic:agent/run@0.4.2"

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain and the wasm target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-wasip2
          rustup default "$RUST_VERSION"
          rustc --version

      - uses: wasmCloud/setup-wash-action@v2.1.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.path }}

      # Only for projects that actually carry a `wit/` tree. The p3 components
      # here (csv-tidy, passphrase) take their bindings from the `wasip3` crate
      # and have no `wit/` directory at all, and `wash wit fetch` exits 1 on
      # those rather than no-opping. Guarding is what lets one matrix cover both
      # shapes; the alternative is a second workflow that differs by one step.
      - name: Fetch the WIT dependencies
        run: |
          if [ -d wit ]; then
            wash wit fetch
          else
            echo "no wit/ directory; bindings come from the crate"
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Build the component
        id: build
        if: matrix.optimize != 'size'
        uses: wasmCloud/actions/wash-build@v2.0.0
        with:
          working-directory: ${{ matrix.path }}

      - name: Install wasm-opt
        if: matrix.optimize == 'size'
        working-directory: ${{ runner.temp }}
        run: |
          archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${archive}"
          echo "${BINARYEN_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          echo "${RUNNER_TEMP}/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          "binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" --version

      # The same source and the same pinned stable toolchain as the standard
      # build (no nightly, no build-std), about 14% smaller:
      #
      # 1. Link the core module without making it a component. The linker
      #    embeds the component type either way; `--skip-wit-component` only
      #    stops it wrapping the module, so wasm-opt can see all of it.
      # 2. Shrink it with `wasm-opt -Oz`, allowing only the features the
      #    wasm32-wasip2 target already emits. Do not swap in
      #    `--all-features`: wasm-opt then uses proposals Wasmtime does not
      #    enable by default, and the result fails to load.
      # 3. Make it a component with `wasm-tools component new`, from the
      #    embedded type, as the linker would have.
      #
      # The standard build is made too, as the reference the next step checks
      # this one's imports and exports against.
      - name: Build the size-optimized component
        id: build-small
        if: matrix.optimize == 'size'
        run: |
          cargo build --target wasm32-wasip2 --release
          reference="$PWD/target/wasm32-wasip2/release/minimal_agent.wasm"

          RUSTFLAGS="-C link-arg=--skip-wit-component" CARGO_TARGET_DIR=target/small \
            cargo build --target wasm32-wasip2 --release
          core=target/small/wasm32-wasip2/release/minimal_agent.wasm
          wasm-opt -Oz \
            --mvp-features --enable-bulk-memory --enable-nontrapping-float-to-int \
            --enable-sign-ext --enable-mutable-globals --enable-multivalue \
            --enable-reference-types \
            "$core" -o target/small/optimized.wasm
          component="$PWD/target/small/minimal_agent_small.wasm"
          wasm-tools component new target/small/optimized.wasm -o "$component"

          echo "standard: $(stat -c %s "$reference") bytes"
          echo "small:    $(stat -c %s "$component") bytes"
          echo "component_path=${component}" >> "$GITHUB_OUTPUT"
          echo "reference_path=${reference}" >> "$GITHUB_OUTPUT"

      - name: Validate the component
        env:
          COMPONENT: ${{ steps.build.outputs.component_path || steps.build-small.outputs.component_path }}
          REFERENCE: ${{ steps.build-small.outputs.reference_path }}
        run: |
          wasm-tools validate --features all "$COMPONENT"
          wit=$(wasm-tools component wit "$COMPONENT")
          echo "$wit"
          echo "$wit" | grep -q -- "${{ matrix.expect }}" || {
            echo "::error::component no longer has '${{ matrix.expect }}'"
            exit 1
          }
          # An optimized build must ask for exactly what the standard build
          # asks for: an import it adds is a grant an operator never reviewed.
          if [ -n "$REFERENCE" ]; then
            world() { wasm-tools component wit "$1" | grep -E '^\s*(import|export) ' | sort; }
            if ! diff <(world "$REFERENCE") <(world "$COMPONENT"); then
              echo "::error::imports or exports differ from the standard build"
              exit 1
            fi
            echo "imports and exports match the standard build"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.build.outputs.component_path || steps.build-small.outputs.component_path }}
          if-no-files-found: error

      - name: Log in to GHCR
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        working-directory: ${{ runner.temp }}
        run: |
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}"
          echo "${ORAS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p oras-bin
          tar -xzf "${archive}" -C oras-bin oras
          echo "${RUNNER_TEMP}/oras-bin" >> "$GITHUB_PATH"
          oras-bin/oras version

      - name: Publish to GHCR
        id: publish
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          COMPONENT: ${{ steps.build.outputs.component_path || steps.build-small.outputs.component_path }}
          NAME: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
        run: |
          # Each entry carries its own image, because these do not share a
          # prefix: first-flight publishes to a bare name and the catalog pins
          # it there. Republishes existing names rather than starting a
          # parallel set.
          image="${IMAGE}"

          # A release tag names ONE component, `<name>-v<version>`, matching the
          # tags this repository already uses. A tag for some other component is
          # not this job's release, so it builds, validates, and stops.
          #
          # This matters because these components carry independent versions. A
          # shared tag namespace would republish every component in the matrix
          # under a version only one of them had bumped, overwriting version
          # tags that the catalog pins by digest and leaving tag and pin
          # disagreeing about what that version is.
          case "${GITHUB_REF}" in
            refs/tags/*)
              tag_name="${GITHUB_REF#refs/tags/}"
              case "${tag_name}" in
                "${NAME}-v"*)
                  tags="${tag_name#${NAME}-v} latest"
                  ;;
                *)
                  echo "tag ${tag_name} does not name ${NAME}; nothing to publish"
                  echo "published=false" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              ;;
            *)
              # A push to main. Note that `latest` then tracks main, while the
              # catalog pins each entry by digest, so the two deliberately do
              # not have to agree: `latest` is for someone trying a component,
              # the digest is what a deployment gets.
              tags="sha-${GITHUB_SHA:0:12} latest"
              ;;
          esac

          # Push once, under the first tag, then point the other tags at that
          # same manifest. Pushing again per tag is not equivalent: wash stamps
          # a creation time into each manifest it writes, so every push of the
          # same bytes gets a new digest, and the attestation below covers one
          # digest only. Tagging the existing manifest is what makes every tag
          # of this build resolve to the one digest that is attested.
          digest=""
          for tag in $tags; do
            if [ -z "$digest" ]; then
              echo "pushing ${image}:${tag}"
              pushed=$(wash oci push --output json "${image}:${tag}" "$COMPONENT")
              digest=$(echo "$pushed" | jq -er '.data.digest | select(test("^sha256:[0-9a-f]{64}$"))') || {
                echo "::error::push reported no digest: $pushed"
                exit 1
              }
              echo "pushed ${image}:${tag} (${digest})"
            else
              oras tag "${image}@${digest}" "${tag}"
              echo "tagged ${image}:${tag} (${digest})"
            fi
          done
          # Check what the registry now serves, not what the commands reported.
          for tag in $tags; do
            resolved=$(oras resolve "${image}:${tag}")
            if [ "$resolved" != "$digest" ]; then
              echo "::error::${image}:${tag} resolves to ${resolved}, not ${digest}"
              exit 1
            fi
          done
          # Every tag now names the same manifest, so one digest describes
          # them all, and attesting it covers every tag.
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Attest the published component
        if: steps.publish.outputs.published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
