# Builds the standalone Rust components and publishes them to GHCR.
#
# The companion to mcp-servers.yml, for projects that are not MCP servers and
# do not sit under a single directory. Unlike the MCP servers, these resolve
# their bindings from a `wit/` tree pinned by `wkg.lock`, so the WIT fetch that
# a reader runs is run here too: if a pinned version rots, this fails rather
# than the reader's first build.
name: components

on:
  push:
    branches: [main]
    tags: ["components/v*"]
    paths:
      - "components/sandboxed-webhook/**"
      - "workload-examples/task-manager/**"
      - ".github/workflows/components.yml"
  pull_request:
    paths:
      - "components/sandboxed-webhook/**"
      - "workload-examples/task-manager/**"
      - ".github/workflows/components.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for the same reason as mcp-servers.yml: for a wasm32-wasip2 build
  # the WASI import versions come from the toolchain rather than from
  # Cargo.lock, so floating it silently changes what a published component
  # asks the host for. Bump deliberately.
  RUST_VERSION: "1.97.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sandboxed-webhook
            path: components/sandboxed-webhook
            # Losing this export is a deployment failure with an opaque
            # message, so it is worth catching as a build failure with an
            # obvious one.
            expect: "export wasi:http/incoming-handler"
          - name: task-manager
            path: workload-examples/task-manager
            expect: "export wasi:http/incoming-handler"

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain and the wasm target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-wasip2
          rustup default "$RUST_VERSION"
          rustc --version

      - uses: wasmCloud/setup-wash-action@v2.1.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.path }}

      # `wit/deps/` is gitignored and the WIT comes from the registry, pinned by
      # `wkg.lock`. Running it here keeps the documented first-build path honest.
      - name: Fetch the WIT dependencies
        run: wash wit fetch

      - name: Build the component
        id: build
        uses: wasmCloud/actions/wash-build@v2.0.0
        with:
          working-directory: ${{ matrix.path }}

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Validate the component
        env:
          COMPONENT: ${{ steps.build.outputs.component_path }}
        run: |
          wasm-tools validate --features all "$COMPONENT"
          wit=$(wasm-tools component wit "$COMPONENT")
          echo "$wit"
          echo "$wit" | grep -q -- "${{ matrix.expect }}" || {
            echo "::error::component no longer has '${{ matrix.expect }}'"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.build.outputs.component_path }}
          if-no-files-found: error

      - name: Log in to GHCR
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        id: publish
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        env:
          COMPONENT: ${{ steps.build.outputs.component_path }}
        run: |
          # Matches the names already published and pinned by the Launchpad
          # catalog, rather than starting a parallel set under a new prefix.
          image="ghcr.io/cosmonic-labs/components/${{ matrix.name }}"

          case "${GITHUB_REF}" in
            refs/tags/components/v*)
              version="${GITHUB_REF#refs/tags/components/v}"
              tags="${version} latest"
              ;;
            *)
              tags="sha-${GITHUB_SHA:0:12} latest"
              ;;
          esac

          digest=""
          for tag in $tags; do
            echo "pushing ${image}:${tag}"
            pushed=$(wash oci push --output json "${image}:${tag}" "$COMPONENT")
            digest=$(echo "$pushed" | jq -er .data.digest) || {
              echo "::error::push reported no digest: $pushed"
              exit 1
            }
            echo "pushed ${image}:${tag} ($digest)"
          done
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Attest the published component
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
