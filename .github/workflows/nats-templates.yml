# Builds the NATS templates, in Rust and Go, and publishes them to GHCR.
#
# Same shape as kafka-templates.yml next door, and for the same reason: the
# useful gate is not "does it compile" but "does the documented path still
# work end to end" — fetch the WIT from the registry, build a component, and
# check it still exports what a host will look for when it loads it.
# Publishing means someone can deploy a manifest without building anything.
#
# One difference from the Kafka workflow: no WKG_CONFIG_FILE. `wasmcloud:nats`
# is served by a registry wash already knows, so there is no mapping to pass.
name: nats-templates

on:
  push:
    branches: [main]
    tags: ["nats-templates/v*"]
    paths:
      - "components/nats/**"
      - ".github/workflows/nats-templates.yml"
  pull_request:
    paths:
      - "components/nats/**"
      - ".github/workflows/nats-templates.yml"
  workflow_dispatch:

# Publishing needs more than `contents`, and attestation more again: the
# provenance is signed with a workflow identity (`id-token`) and recorded
# against the repository (`attestations`).
permissions:
  contents: read

# A newer push to the same branch makes this run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, following mcp-servers.yml rather than the Kafka workflow, which
  # floats on `rustup update stable`.
  #
  # For `cargo build --target wasm32-wasip2` the WASI import versions come from
  # the standard library shipped with rustc, not from Cargo.lock, so a floating
  # toolchain silently changes a published component's import surface —
  # measured on this repository as `wasi:*@0.2.6` to `@0.2.9` plus seven extra
  # `wasi:cli` interfaces the earlier build never asked for. These templates
  # are published as attested components that their own manifests pull by
  # `:latest`, and their whole subject is deny-by-default grants an operator
  # reviews. That import list should move when someone decides it moves.
  # Bump deliberately, and expect the published imports to change when you do.
  RUST_VERSION: "1.97.1"

  # componentize-go decides the WASI p3 interface versions the Go bindings are
  # generated against, so it pins the published import surface the same way
  # RUST_VERSION does above. `actions/setup-go` pins nothing about the
  # component: see the note on the `go` job.
  COMPONENTIZE_GO_VERSION: "v0.4.1"

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `wash oci push` authenticates to GHCR as the workflow.
      packages: write
      # For the build provenance attached to each published component.
      attestations: write
      id-token: write
    strategy:
      # Each template is independent, so one failing should not hide the others.
      fail-fast: false
      matrix:
        include:
          # Losing an export is a deployment failure with an opaque message,
          # so it is worth catching as a build failure with an obvious one.
          - name: nats-core-subscriber
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-request-reply
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-fan-out
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-jetstream-consumer
            expect: "export wasmcloud:nats/jetstream-handler"
          - name: nats-jetstream-worker
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-kv-store
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-kv-watcher
            expect: "export wasmcloud:nats/kv-handler"

    defaults:
      run:
        working-directory: components/nats/rust/${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain and the wasm target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-wasip2
          rustup default "$RUST_VERSION"
          rustc --version

      # `wash-version` defaults to `latest`. Deliberately not pinned: these
      # templates track an evolving host interface, so CI finding out that a
      # new wash no longer builds them is the point rather than the failure
      # mode.
      - uses: wasmCloud/setup-wash-action@v2.1.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components/nats/rust/${{ matrix.name }}

      # The whole reason `wit/deps/` is gitignored: the WIT comes from the
      # registry, pinned by `wkg.lock`. Running it here is what keeps the
      # documented first-build path honest — if a pinned version rots, this
      # fails rather than a user's first attempt.
      - name: Fetch the WIT dependencies
        run: wash wit fetch

      # Runs each template's own `.wash/config.yaml`, so CI builds the way the
      # READMEs tell a reader to and reports back where the component landed
      # rather than this workflow reconstructing the path per template.
      - name: Build the component
        id: build
        uses: wasmCloud/actions/wash-build@v2.0.0
        with:
          working-directory: components/nats/rust/${{ matrix.name }}

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      # The two checks a build cannot make: that the output is a valid
      # component at all, and that it still exports what a host looks for.
      - name: Validate the component
        env:
          COMPONENT: ${{ steps.build.outputs.component_path }}
        run: |
          wasm-tools validate --features all "$COMPONENT"
          wit=$(wasm-tools component wit "$COMPONENT")
          echo "$wit"
          echo "$wit" | grep -q -- "${{ matrix.expect }}" || {
            echo "::error::component no longer has '${{ matrix.expect }}'"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.build.outputs.component_path }}
          if-no-files-found: error

      # Pull requests build and validate but never publish: a fork's token
      # cannot write packages, and an unreviewed change should not become the
      # image someone pulls.
      # `wasmCloud/actions/wash-oci-publish` does this job upstream and this
      # mirrors its shape — log in with `docker/login-action`, then let
      # `wash oci push` read those credentials. It is the one action here not
      # used directly, because it derives the image name from
      # `$GITHUB_REPOSITORY` with no way to override it, which would push all
      # seven templates to one `awesome-cosmonic` package separated only by
      # tag. A repository that collects many unrelated examples needs a name
      # per component.
      - name: Log in to GHCR
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        id: publish
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        env:
          COMPONENT: ${{ steps.build.outputs.component_path }}
        run: |
          image="ghcr.io/cosmonic-labs/nats-templates/${{ matrix.name }}"

          # A tag push is a release and carries the version it names; anything
          # else is whatever main happens to be right now. Both move `latest`,
          # because that is the reference the templates' own manifests use —
          # someone deploying one to try NATS should get a component without
          # first hunting for a tag that exists. The immutable `sha-` tag is
          # what to pin to when that matters.
          case "${GITHUB_REF}" in
            refs/tags/nats-templates/v*)
              version="${GITHUB_REF#refs/tags/nats-templates/v}"
              tags="${version} latest"   # latest last: it is what gets attested
              ;;
            *)
              tags="sha-${GITHUB_SHA:0:12} latest"   # latest last: it is what gets attested
              ;;
          esac

          digest=""
          for tag in $tags; do
            echo "pushing ${image}:${tag}"
            pushed=$(wash oci push --output json "${image}:${tag}" "$COMPONENT")
            digest=$(echo "$pushed" | jq -er .data.digest) || {
              echo "::error::push reported no digest: $pushed"
              exit 1
            }
            echo "pushed ${image}:${tag} ($digest)"
          done
          # The tags carry identical component bytes but NOT a shared manifest
          # digest: `wash oci push` builds a fresh, non-reproducible manifest
          # per push, so pushing the same file twice yields two digests
          # (measured). `latest` is pushed last on purpose — it is the
          # reference every shipped manifest uses, so it is the one worth
          # attesting, and this carries its digest to the attest step. The
          # immutable `sha-` tag is the same bytes under its own manifest.
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      # Provenance for something a newcomer is told to pull and run: it ties
      # the published bytes back to this workflow and this commit.
      - name: Attest the published component
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  # Go builds through componentize-go. wasmcloud:nats@0.1.0 is async-only WASI
  # p3 and stock Go cannot emit the component-model concurrency ABI, so
  # componentize-go fetches a patched Go (golang/go#76775) and builds with
  # that instead of whatever is on PATH.
  #
  # What pins the published import surface is therefore
  # COMPONENTIZE_GO_VERSION, not the setup-go version: the installed command is
  # a small downloader, the binary it fetches is the real tool, and that binary
  # hardcodes which patched Go it uses. Bumping componentize-go can move every
  # published component's imports; bumping setup-go moves nothing. That is the same
  # property RUST_VERSION exists to control on the rust job, reached by a
  # different route, so pin componentize-go deliberately.
  #
  # Supply chain, stated rather than implied: that patched toolchain comes
  # from a fork's release tag and the downloader performs no checksum of its
  # own. These components are attested and published to `:latest`, so the Go
  # half has materially weaker provenance than the Rust half. componentize-go
  # accepts a `--url`, so mirroring the artifact is the mitigation if that
  # matters more than the convenience.
  # Fetch the Go toolchain once, for all seven builds below.
  #
  # `go install componentize-go` installs a *downloader*. The first build it
  # runs fetches the real binary, and then, because async WASI p3 needs
  # `runtime.wasiOnIdle` and stock Go does not have it, a patched Go from a
  # fork's release tag. Both land in ~/.cache/componentize-go.
  #
  # Left to the matrix, all seven jobs fetch those same two archives from
  # GitHub at the same instant whenever the cache is cold, and it is cold on
  # the first run of any branch: a pull request's cache is not readable from
  # `main`, so a merge is always a cold start. That race is what broke `main`
  # at c550a70 -- GitHub answered one of the seven with an HTTP/2
  # `REFUSED_STREAM`, so `nats-kv-watcher-go` failed with "failed to install
  # patched version of Go" while the other six passed. Fetching once removes
  # the race, and six redundant downloads with it.
  go-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      # Where `go install` puts the binary. Set it whether this run installs
      # the toolchain or restores it.
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/componentize-go
            ~/go/bin
            ~/go/pkg/mod
          key: componentize-go-${{ env.COMPONENTIZE_GO_VERSION }}-${{ runner.os }}

      - name: Download the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The binary is the module root, not a cmd/ subpackage.
          go install github.com/bytecodealliance/componentize-go@${{ env.COMPONENTIZE_GO_VERSION }}
          # Both archives come from GitHub releases, where a refused stream or
          # a reset mid-download is transient. `install-go` is the tool's own
          # retry entry point: it is what its error message tells you to run.
          for attempt in 1 2 3; do
            if componentize-go install-go; then exit 0; fi
            echo "::warning::componentize-go install-go failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] || sleep $(( attempt * 15 ))
          done
          echo "::error::could not download the patched Go toolchain in 3 attempts"
          exit 1

  go:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: go-toolchain
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nats-core-subscriber-go
            dir: nats-core-subscriber
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-request-reply-go
            dir: nats-request-reply
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-fan-out-go
            dir: nats-fan-out
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-jetstream-consumer-go
            dir: nats-jetstream-consumer
            expect: "export wasmcloud:nats/jetstream-handler"
          - name: nats-jetstream-worker-go
            dir: nats-jetstream-worker
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-kv-store-go
            dir: nats-kv-store
            expect: "export wasmcloud:nats/core-handler"
          - name: nats-kv-watcher-go
            dir: nats-kv-watcher
            expect: "export wasmcloud:nats/kv-handler"

    defaults:
      run:
        working-directory: components/nats/go/${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v4

      # Needed to run `go install` (componentize-go's module requires Go >=
      # 1.25) and for the `go mod tidy` in each template's bindings step. It
      # does NOT decide what the component is compiled with: see the note on
      # this job.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Read-only. `go-toolchain` is the single writer, so the seven builds
      # neither race to download the toolchain nor race to save it.
      - name: Restore the componentize-go toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/componentize-go
            ~/go/bin
            ~/go/pkg/mod
          key: componentize-go-${{ env.COMPONENTIZE_GO_VERSION }}-${{ runner.os }}

      # `needs:` means that cache was written, so this should not fire. If
      # eviction between the two jobs means it does, install here rather than
      # failing the build with a bare "componentize-go: command not found".
      - name: Install componentize-go
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          go install github.com/bytecodealliance/componentize-go@${{ env.COMPONENTIZE_GO_VERSION }}
          componentize-go install-go

      # Compiling the Go standard library for wasm is the slow part of `make
      # build`, and it is per-template. A separate cache from the toolchain
      # above, so each one has exactly one writer.
      - name: Cache the Go build output
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ env.COMPONENTIZE_GO_VERSION }}-${{ runner.os }}-${{ matrix.dir }}
          restore-keys: go-build-${{ env.COMPONENTIZE_GO_VERSION }}-${{ runner.os }}-

      - uses: wasmCloud/setup-wash-action@v2.1.0

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      # `make build` fetches the WIT by wkg.lock, generates the bindings and
      # builds; `make verify` asserts the export is there and the lift is
      # async, which is the failure a Go handler that parks on a timer
      # produces.
      - name: Build and verify
        run: make verify

      - name: Validate the component
        env:
          COMPONENT: ${{ matrix.dir }}.wasm
        run: |
          wasm-tools validate --features all "$COMPONENT"
          wit=$(wasm-tools component wit "$COMPONENT")
          echo "$wit"
          echo "$wit" | grep -q -- "${{ matrix.expect }}" || {
            echo "::error::component no longer has '${{ matrix.expect }}'"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: components/nats/go/${{ matrix.dir }}/${{ matrix.dir }}.wasm
          if-no-files-found: error

      - name: Log in to GHCR
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        id: publish
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        env:
          COMPONENT: ${{ matrix.dir }}.wasm
        run: |
          image="ghcr.io/cosmonic-labs/nats-templates/${{ matrix.name }}"
          case "${GITHUB_REF}" in
            refs/tags/nats-templates/v*)
              version="${GITHUB_REF#refs/tags/nats-templates/v}"
              tags="${version} latest"   # latest last: it is what gets attested
              ;;
            *)
              tags="sha-${GITHUB_SHA:0:12} latest"   # latest last: it is what gets attested
              ;;
          esac
          digest=""
          for tag in $tags; do
            echo "pushing ${image}:${tag}"
            pushed=$(wash oci push --output json "${image}:${tag}" "$COMPONENT")
            digest=$(echo "$pushed" | jq -er .data.digest) || {
              echo "::error::push reported no digest: $pushed"
              exit 1
            }
            echo "pushed ${image}:${tag} ($digest)"
          done
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Attest the published component
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
