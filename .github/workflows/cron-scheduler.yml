name: cron-scheduler

on:
  push:
    branches: [main]
    paths:
      - "host-plugins/component/cron-scheduler/**"
      - "wit/cosmonic-cron/**"
      - "wit/wkg-registries.toml"
      - ".github/workflows/cron-scheduler.yml"
  pull_request:
    paths:
      - "host-plugins/component/cron-scheduler/**"
      - "wit/cosmonic-cron/**"
      - "wit/wkg-registries.toml"
      - ".github/workflows/cron-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let publishing finish so pushed artifacts receive their attestation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: "1.99.0"
  WASH_VERSION: v2.10.3
  WASH_SOURCE_REVISION: 548bb21b65ac8cc03776f73656c4bf7be2f96992 # v2.10.3
  WASM_TOOLS_VERSION: 1.258.0

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WKG_CONFIG_FILE: ${{ github.workspace }}/wit/wkg-registries.toml
    defaults:
      run:
        working-directory: host-plugins/component/cron-scheduler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and the Wasm target
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --target wasm32-wasip2

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cron-scheduler
          cache-bin: false
          workspaces: |
            host-plugins/component/cron-scheduler -> target
            host-plugins/component/cron-scheduler/tests/fixtures/ticker -> target

      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path tests/fixtures/ticker/Cargo.toml --check

      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}

      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}

      - name: Run native tests and Clippy
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build the plugin
        run: |
          wash build
          cargo clippy --locked --target wasm32-wasip2 --lib -- -D warnings

      - name: Build the test workload
        working-directory: host-plugins/component/cron-scheduler/tests/fixtures/ticker
        run: wash build

      - name: Validate components and required exports
        run: |
          plugin=target/wasm32-wasip2/release/cron_scheduler.wasm
          ticker=tests/fixtures/ticker/target/wasm32-wasip2/release/ticker.wasm
          wasm-tools validate --features all "$plugin"
          wasm-tools validate --features all "$ticker"
          wasm-tools component wit "$plugin" > "$RUNNER_TEMP/cron-plugin.wit"
          wasm-tools component wit "$ticker" > "$RUNNER_TEMP/cron-ticker.wit"
          grep -F 'export cosmonic:cron/types@0.1.0;' "$RUNNER_TEMP/cron-plugin.wit"
          grep -F 'export cosmonic:cron/scheduler@0.1.0;' "$RUNNER_TEMP/cron-plugin.wit"
          grep -F 'export wasmcloud:host/workload-lifecycle@0.1.3;' "$RUNNER_TEMP/cron-plugin.wit"
          grep -F 'export wasi:cli/run@0.3.0;' "$RUNNER_TEMP/cron-plugin.wit"
          grep -F 'export cosmonic:cron/handler@0.1.0;' "$RUNNER_TEMP/cron-ticker.wit"
          grep -F 'export wasi:http/handler@0.3.0;' "$RUNNER_TEMP/cron-ticker.wit"

      - name: Check dependency locks
        run: git diff --exit-code -- Cargo.lock wkg.lock tests/fixtures/ticker/Cargo.lock tests/fixtures/ticker/wkg.lock

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cron-scheduler
          path: |
            host-plugins/component/cron-scheduler/target/wasm32-wasip2/release/cron_scheduler.wasm
            host-plugins/component/cron-scheduler/tests/fixtures/ticker/target/wasm32-wasip2/release/ticker.wasm
          if-no-files-found: error

  build-integration-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Cache the pinned integration host
        id: host-cache
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ runner.temp }}/cron-integration-host/wash
          key: cron-host-ubuntu24.04-${{ runner.arch }}-${{ env.WASH_SOURCE_REVISION }}-${{ env.RUSTUP_TOOLCHAIN }}-no-default-host-plugins-debug0-v1

      - name: Check out the pinned wash source
        if: steps.host-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wasmCloud/wasmCloud
          ref: ${{ env.WASH_SOURCE_REVISION }}
          path: wash-source
          persist-credentials: false

      - name: Install the host build toolchain
        if: steps.host-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Build wash with host component plugins
        if: steps.host-cache.outputs.cache-hit != 'true'
        working-directory: wash-source
        run: |
          cargo build --locked -p wash --bin wash --no-default-features --features host-component-plugins
          install -Dm755 target/debug/wash "$RUNNER_TEMP/cron-integration-host/wash"

      - name: Check the integration host
        run: '"$RUNNER_TEMP/cron-integration-host/wash" --version'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cron-integration-host
          path: ${{ runner.temp }}/cron-integration-host/wash
          if-no-files-found: error
          retention-days: 1

  integration:
    needs: [test-and-build, build-integration-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WKG_CONFIG_FILE: ${{ github.workspace }}/wit/wkg-registries.toml
    defaults:
      run:
        working-directory: host-plugins/component/cron-scheduler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust for the test driver
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Restore Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cron-scheduler
          cache-bin: false
          save-if: false
          workspaces: |
            host-plugins/component/cron-scheduler -> target
            host-plugins/component/cron-scheduler/tests/fixtures/ticker -> target

      - name: Download validated components
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cron-scheduler
          path: host-plugins/component/cron-scheduler

      - name: Download the pinned integration host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cron-integration-host
          path: ${{ runner.temp }}/cron-integration-host

      - name: Run host integration tests
        env:
          WASH: ${{ runner.temp }}/cron-integration-host/wash
          CRON_E2E_PREBUILT: "1"
          TMPDIR: ${{ runner.temp }}
        run: |
          chmod +x "$WASH"
          cargo test --locked --test e2e -- --ignored --nocapture

      - name: Check dependency locks
        run: git diff --exit-code -- Cargo.lock wkg.lock tests/fixtures/ticker/Cargo.lock tests/fixtures/ticker/wkg.lock

      - name: Upload failed host logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cron-scheduler-host-logs
          path: ${{ runner.temp }}/cron-scheduler-e2e-*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [test-and-build, integration]
    if: >-
      github.repository == 'cosmonic-labs/awesome-cosmonic' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/cosmonic-labs/host-plugins/cron-scheduler
      COMPONENT: dist/target/wasm32-wasip2/release/cron_scheduler.wasm
    steps:
      - name: Check out current main for the freshness check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested components
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cron-scheduler
          path: dist

      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        id: push
        run: |
          set -euo pipefail
          test -s "$COMPONENT"
          for kind in sha latest; do
            if [[ "$kind" == latest ]]; then
              # Unrelated main changes do not invalidate this tested build.
              changes=$(git diff --name-only "$GITHUB_SHA" HEAD -- \
                host-plugins/component/cron-scheduler \
                wit/cosmonic-cron \
                wit/wkg-registries.toml \
                .github/workflows/cron-scheduler.yml)
              if [[ -n "$changes" ]]; then
                echo "::notice::newer cron sources exist on main; leaving latest unchanged"
                continue
              fi
            fi
            tag="$kind"
            if [[ "$kind" == sha ]]; then
              tag="sha-${GITHUB_SHA:0:12}"
            fi
            pushed=$(wash --output json oci push "${IMAGE}:${tag}" "$COMPONENT")
            digest=$(jq -er '.data.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$pushed")
            echo "${kind}-digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "pushed ${IMAGE}:${tag} (${digest})"
          done

      # wash adds a creation timestamp per push, so each tag has its own manifest.
      - name: Attest the commit tag
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.sha-digest }}
          push-to-registry: true

      - name: Attest latest
        if: steps.push.outputs.latest-digest != ''
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.latest-digest }}
          push-to-registry: true

      - name: Verify anonymous pulls and report published references
        env:
          SHA_DIGEST: ${{ steps.push.outputs.sha-digest }}
          LATEST_DIGEST: ${{ steps.push.outputs.latest-digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d "$RUNNER_TEMP/cron-anonymous.XXXXXX")
          pulled="$anonymous_config/cron_scheduler.wasm"
          for digest in "$SHA_DIGEST" "$LATEST_DIGEST"; do
            if [[ -z "$digest" ]]; then
              continue
            fi
            if ! DOCKER_CONFIG="$anonymous_config" wash oci pull "${IMAGE}@${digest}" "$pulled"; then
              echo "::error::anonymous pull failed; for a new GHCR package, set its visibility to Public in Package settings and rerun the publish job (see the plugin README)"
              exit 1
            fi
            cmp "$COMPONENT" "$pulled"
          done
          {
            echo '### cron-scheduler published'
            echo "- Commit tag: \`${IMAGE}:sha-${GITHUB_SHA:0:12}\`"
            echo "- Commit digest: \`${IMAGE}@${SHA_DIGEST}\`"
            if [[ -n "$LATEST_DIGEST" ]]; then
              echo "- Image: \`${IMAGE}:latest\`"
              echo "- Latest digest: \`${IMAGE}@${LATEST_DIGEST}\`"
            else
              echo '- Latest left unchanged: newer cron sources exist on main.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
