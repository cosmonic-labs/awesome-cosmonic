# Builds the Rust Kafka templates and publishes them to GHCR.
#
# The templates exist to be handed to someone trying Kafka on Cosmonic for the
# first time, so the useful gate is not "does it compile" but "does the
# documented path still work end to end": fetch the WIT from the registry,
# build a component, and check it still exports what a host will look for when
# it loads it. Publishing means that person can deploy a manifest without
# building anything at all.
name: kafka-templates

on:
  push:
    branches: [main]
    tags: ["kafka-templates/v*"]
    paths:
      - "templates/kafka/rust/**"
      - "templates/kafka/wkg-registries.toml"
      - ".github/workflows/kafka-templates.yml"
  pull_request:
    paths:
      - "templates/kafka/rust/**"
      - "templates/kafka/wkg-registries.toml"
      - ".github/workflows/kafka-templates.yml"
  workflow_dispatch:

# Publishing needs more than `contents`, and attestation more again: the
# provenance is signed with a workflow identity (`id-token`) and recorded
# against the repository (`attestations`).
permissions:
  contents: read

# A newer push to the same branch makes this run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `wash oci push` authenticates to GHCR as the workflow.
      packages: write
      # For the build provenance attached to each published component.
      attestations: write
      id-token: write
    strategy:
      # Each template is independent, so one failing should not hide the others.
      fail-fast: false
      matrix:
        include:
          - name: http-kafka-producer
            # Losing this export is a deployment failure with an opaque
            # message, so it is worth catching as a build failure with an
            # obvious one.
            expect: "export wasi:http/handler"
          - name: kafka-handler-consumer
            expect: "export cosmonic:kafka/handler"
          - name: kafka-pull-service
            expect: "export wasi:cli/run"
          - name: kafka-transactional
            expect: "export wasi:cli/run"

    # Job-wide, not per-step: `wash build` runs a WIT fetch of its own before
    # it runs the build command, so the registry mapping has to be visible to
    # every step that shells out to wash — not only the explicit fetch below.
    # Without it the build fails with `no registry configured for namespace
    # "cosmonic"` even though the dependencies are already on disk.
    env:
      WKG_CONFIG_FILE: ${{ github.workspace }}/templates/kafka/wkg-registries.toml

    defaults:
      run:
        working-directory: templates/kafka/rust/${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: |
          rustup update stable --no-self-update
          rustup target add wasm32-wasip2

      # `wash-version` defaults to `latest`. Deliberately not pinned: these
      # templates track an evolving host interface, so CI finding out that a
      # new wash no longer builds them is the point rather than the failure
      # mode.
      - uses: wasmCloud/setup-wash-action@v2.1.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: templates/kafka/rust/${{ matrix.name }}

      # The whole reason `wit/deps/` is gitignored: the WIT comes from the
      # registry, pinned by `wkg.lock`. Running it here is what keeps the
      # documented first-build path honest — if the registry mapping or a
      # pinned version rots, this fails rather than a user's first attempt.
      - name: Fetch the WIT dependencies
        run: wash wit fetch

      # Runs each template's own `.wash/config.yaml`, so CI builds the way the
      # READMEs tell a reader to and reports back where the component landed
      # rather than this workflow reconstructing the path per template.
      - name: Build the component
        id: build
        uses: wasmCloud/actions/wash-build@v2.0.0
        with:
          working-directory: templates/kafka/rust/${{ matrix.name }}

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      # The two checks a build cannot make: that the output is a valid
      # component at all, and that it still exports what a host looks for.
      - name: Validate the component
        env:
          COMPONENT: ${{ steps.build.outputs.component_path }}
        run: |
          wasm-tools validate --features all "$COMPONENT"
          wit=$(wasm-tools component wit "$COMPONENT")
          echo "$wit"
          echo "$wit" | grep -q -- "${{ matrix.expect }}" || {
            echo "::error::component no longer has '${{ matrix.expect }}'"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.build.outputs.component_path }}
          if-no-files-found: error

      # Pull requests build and validate but never publish: a fork's token
      # cannot write packages, and an unreviewed change should not become the
      # image someone pulls.
      #
      # `wasmCloud/actions/wash-oci-publish` does this job upstream and this
      # mirrors its shape — log in with `docker/login-action`, then let
      # `wash oci push` read those credentials. It is the one action here not
      # used directly, because it derives the image name from
      # `$GITHUB_REPOSITORY` with no way to override it, which would push all
      # four templates to one `awesome-cosmonic` package separated only by
      # tag. A repository that collects many unrelated examples needs a name
      # per component.
      - name: Log in to GHCR
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        id: publish
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        env:
          COMPONENT: ${{ steps.build.outputs.component_path }}
        run: |
          image="ghcr.io/cosmonic-labs/kafka-templates/${{ matrix.name }}"

          # A tag push is a release and carries the version it names; anything
          # else is whatever main happens to be right now.
          case "${GITHUB_REF}" in
            refs/tags/kafka-templates/v*)
              version="${GITHUB_REF#refs/tags/kafka-templates/v}"
              tags="${version} latest"
              ;;
            *)
              tags="sha-${GITHUB_SHA:0:12}"
              ;;
          esac

          digest=""
          for tag in $tags; do
            echo "pushing ${image}:${tag}"
            pushed=$(wash oci push --output json "${image}:${tag}" "$COMPONENT")
            digest=$(echo "$pushed" | jq -er .data.digest) || {
              echo "::error::push reported no digest: $pushed"
              exit 1
            }
            echo "pushed ${image}:${tag} ($digest)"
          done
          # Every tag carries the same bytes, so one digest describes them all.
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      # Provenance for something a newcomer is told to pull and run: it ties
      # the published bytes back to this workflow and this commit.
      - name: Attest the published component
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'cosmonic-labs/awesome-cosmonic'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
