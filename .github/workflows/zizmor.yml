# Static analysis of the workflows in this repository for security problems
# such as unpinned actions, excessive permissions, and template injection.
name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Scoped to the workflows that are clean. The older workflows have
          # findings (mostly unpinned actions) that need their own cleanup;
          # add them here as they are fixed.
          inputs: .github/workflows/wit.yml .github/workflows/zizmor.yml
          # Without a token the online audits are skipped silently.
          token: ${{ github.token }}
          advanced-security: false
