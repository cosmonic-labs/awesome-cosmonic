# Validates the cosmonic:agent, cosmonic:kafka and cosmonic:notifications WIT packages and publishes
# them to GHCR as ghcr.io/cosmonic-labs/<namespace>/<package>.
#
# The version in each package's `package` declaration is the release version.
# A merge to main that bumps it publishes that version. A change without a bump
# fails, so the registry and the repo cannot drift.
#
# The logic lives in .github/scripts/wit/*.mjs so it can be run locally:
#   node .github/scripts/wit/build.mjs wit/cosmonic-agent agent
#   node .github/scripts/wit/build.mjs wit/cosmonic-kafka kafka
#   node .github/scripts/wit/registry.mjs check agent dist/agent.wasm --anonymous
name: wit

on:
  push:
    branches: [main]
    paths:
      - "wit/**"
      - ".github/scripts/wit/**"
      - ".github/workflows/wit.yml"
  pull_request:
    paths:
      - "wit/**"
      - ".github/scripts/wit/**"
      - ".github/workflows/wit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let main runs finish: cancelling one mid-publish could leave a pushed
  # version without its attestation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  WASH_VERSION: v2.9.0
  WASM_TOOLS_VERSION: 1.258.0

jobs:
  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: agent
            namespace: cosmonic
            id: cosmonic:agent
            dir: wit/cosmonic-agent
          - package: kafka
            namespace: cosmonic
            id: cosmonic:kafka
            dir: wit/cosmonic-kafka
          - package: notifications
            namespace: cosmonic
            id: cosmonic:notifications
            dir: wit/cosmonic-notifications
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}

      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}

      - name: Test WIT workflow helpers
        run: node --test .github/scripts/wit/*.test.mjs

      - name: Validate and build
        run: node .github/scripts/wit/build.mjs "${{ matrix.dir }}" "${{ matrix.id }}"

      # Anonymous and read-only, so it only sees public packages; one that is
      # not published yet, or not public, passes with a notice.
      - name: Fail if the version is published with different contents
        run: node .github/scripts/wit/registry.mjs check "${{ matrix.id }}" "dist/${{ matrix.package }}.wasm" --anonymous

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}.wasm
          if-no-files-found: error

  publish:
    name: publish ${{ matrix.package }}
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'cosmonic-labs/awesome-cosmonic' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # attest-build-provenance signs with a Sigstore certificate issued
      # against the job's OIDC token (id-token), stores the attestation with
      # GitHub (attestations) and records the artifact (artifact-metadata).
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: agent
            namespace: cosmonic
            id: cosmonic:agent
          - package: kafka
            namespace: cosmonic
            id: cosmonic:kafka
          - package: notifications
            namespace: cosmonic
            id: cosmonic:notifications
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/wit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package }}
          path: dist

      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}

      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push when new, attest when an earlier attempt pushed these bytes and
      # then failed, fail when the version holds other contents.
      - name: Check whether this version is already published
        id: check
        run: node .github/scripts/wit/registry.mjs check "${{ matrix.id }}" "dist/${{ matrix.package }}.wasm"

      - name: Push
        id: push
        if: steps.check.outputs.action == 'push'
        run: node .github/scripts/wit/registry.mjs push "${{ matrix.id }}" "dist/${{ matrix.package }}.wasm"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/cosmonic-labs/${{ matrix.namespace }}/${{ matrix.package }}
          subject-digest: ${{ steps.push.outputs.digest || steps.check.outputs.digest }}
          push-to-registry: true

      # Pulls the package back at the attested digest, the way a consumer would.
      - name: Verify what landed
        env:
          PACKAGE: ${{ matrix.package }}
          PACKAGE_ID: ${{ matrix.id }}
          DIGEST: ${{ steps.push.outputs.digest || steps.check.outputs.digest }}
        run: node .github/scripts/wit/registry.mjs verify "$PACKAGE_ID" "dist/${PACKAGE}.wasm" "$DIGEST"
