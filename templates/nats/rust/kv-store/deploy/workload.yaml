# Cosmonic Desktop / wasmCloud v2 Workload manifest.
#
# Rename every `nats-kv-store` occurrence when you fork, and narrow the grants below -
# they are deny-by-default and intentionally minimal.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "nats-kv-store"
  namespace: default
  labels:
    app.kubernetes.io/name: "nats-kv-store"
    app.kubernetes.io/version: "0.1.0"
    cosmonic.com/pattern: "kv-store"
    cosmonic.com/language: "rust"
  annotations:
    desktop.cosmonic.com/source: template
spec:
  hostInterfaces:
    - namespace: wasmcloud
      package: nats
      version: "0.1.0"
      interfaces: ["types", "kv", "jetstream", "core-handler"]
      config:
        # Grants are deny-by-default and separate on purpose: subject-allow
        # covers publish/request, stream-allow covers stream reads,
        # bucket-allow covers KV. Widen only what this workload needs.
            subject-allow: kv.run,done.kv-worker.>
            bucket-allow: appkv
            core-subscriptions: kv.run
  components:
    - name: kv-store
      image: ghcr.io/your-org/nats-kv-store:0.1.0
      # Instance reuse: `poolSize` keeps up to N instances warm and reuses
      # them across deliveries - it applies to every delivery path
      # (request/reply, core, JetStream, and KV watch). A warm instance skips
      # cold instantiation, and each one retains its heap, so the memory cost
      # scales with poolSize × payload - leave it at 1 for payloads ≥1 MB
      # unless host memory is sized for that product.
      #
      # Reuse is also a state contract: package-level state survives across
      # deliveries on a warm instance - write handlers that treat it as a
      # cache (the shipped handler is reuse-safe). Unset or 0 declares state
      # ephemeral: a fresh instance per delivery, guaranteed.
      #
      # Example - raise put/get throughput at small values:
      #   poolSize: 4
      poolSize: 1
      # How many calls one warm instance serves before it is retired and
      # replaced. 0 = unlimited - an instance lives until the pool reclaims
      # it. Set a bound if package-level state should decay, or to recycle
      # instances on a long-lived deployment.
      maxInvocations: 0
      localResources:
        # This component's own outbound-HTTP allowlist (wasi:http). Empty
        # denies every outbound host. NATS traffic flows through the host
        # binding above, not HTTP, so leave this empty unless the handler
        # genuinely dials out - then list exactly the hosts it needs.
        allowedHosts: []
