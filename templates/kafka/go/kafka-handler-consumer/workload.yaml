apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: kafka-handler-consumer
  namespace: default
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.3.0
      interfaces: [handler, types]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # `topics` is BOTH the subscription list and the produce/consume
        # grant. This handler consumes demo.events only.
        topics: "demo.events"
        # Stable group id — without one the driver derives
        # {ns}/{workload}/{component}-handler, which collides if two
        # installations share a broker.
        group.id: "demo-events-handler"
        auto.offset.reset: earliest
        # ALWAYS set a DLQ: a `permanent` error without one stalls the
        # partition forever.
        dead-letter.topic: "demo.events.dlq"
  components:
    - name: consumer
      image: ghcr.io/CHANGEME/kafka-handler-consumer-go:0.1.0
      # poolSize/maxConcurrency do not apply to handler dispatch — scale
      # with partitions x replicas instead.
      localResources:
        allowedHosts: []
