apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: kafka-transactional
  namespace: default
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.3.0
      interfaces: [consumer, producer, types]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: "demo.events,demo.enriched"
        # One stable transactional.id per logical pipeline: it is the fencing
        # token that makes restarts safe. Host-pinned here so a guest cannot
        # change it.
        transactional.id: "demo-pipeline-txn-1"
  components:
    - name: pipeline
      image: ghcr.io/CHANGEME/kafka-transactional-go:0.1.0
      localResources:
        environment:
          config:
            IN_TOPIC: demo.events
            OUT_TOPIC: demo.enriched
            GROUP_ID: demo-txn-g1
            BATCH_SIZE: "100"
        allowedHosts: []
