[package]
name = "jco-node-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "The host side of jco:node@0.1.0 as a native wasmCloud host plugin, so components built with Jco's Node.js builtin support run on a Rust host."
license = "Apache-2.0"
repository = "https://github.com/cosmonic-labs/awesome-cosmonic"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "jco-node-run"
path = "src/bin/jco-node-run.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
libc = "0.2"
sysinfo = "0.32"
wasmtime-wasi = { version = "48", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "process", "fs"] }
tracing = "0.1"
# crates.io carries only a placeholder wash-runtime, so the runtime comes from
# git at a fixed rev. wasmtime is taken from its re-export rather than declared
# here, which keeps the store and linker types identical to the host's.
wash-runtime = { git = "https://github.com/wasmCloud/wasmCloud", rev = "3903d076d656ff4abea412b6f0fae139b535e7ed", default-features = false }
