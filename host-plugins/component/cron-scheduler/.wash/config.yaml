# wash v2 project configuration.
version: "0.1.0"
build:
  # The target is spelled out because the crate has no `.cargo/config.toml`:
  # a plain `cargo test` has to stay a native build so the schedule logic can
  # be tested on the host.
  #
  # `wash wit fetch` first: wit/deps/ is generated and gitignored, so a fresh
  # clone has only world.wit. Its stdout is discarded so that
  # `wash build --output json` prints nothing but JSON.
  command: wash wit fetch >/dev/null && cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/cron_scheduler.wasm

# No `dev:` block. A host component plugin is not a workload: it is loaded by
# another project's `dev.plugins`, or by `wash host --host-plugin`. The test
# workload in tests/ticker does exactly that; see the README.
