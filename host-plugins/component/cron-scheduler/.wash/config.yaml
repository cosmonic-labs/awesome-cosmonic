# wash v2 project configuration.
version: "0.1.0"
build:
  # The target is spelled out because `.cargo/config.toml` sets none: a plain
  # `cargo test` has to stay a native build so the schedule logic can be
  # tested on the host.
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/cron_scheduler.wasm

# No `dev:` block. A host component plugin is not a workload: it is loaded by
# another project's `dev.plugins`, or by `wash host --host-plugin`. The test
# workload in tests/fixtures/ticker does exactly that; see the README.
