# wash v2 project configuration — used by Cosmonic Desktop's project mode
# (build + dev loop + promote) and by the `wash` CLI alike.
version: "0.1.0"
build:
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/atlassian_confluence_mcp.wasm
# Mirrors WorkloadDeployment components[].localResources; carried over into
# the durable Workload draft when you promote this project. Keep in step with
# deploy/workload.yaml.
workload:
  environment:
    config:
      RUST_LOG: info
      MCP_ALLOWED_HOSTS: "atlassian-confluence-mcp.localhost"
      ATLASSIAN_SITE: "your-site.atlassian.net"
      ATLASSIAN_EMAIL: "you@example.com"
      CONFLUENCE_READ_ONLY: "false"
      CONFLUENCE_ALLOW_DELETE: "false"
    # Secret refs are listed by name here (the workload manifest uses {name}).
    secretFrom:
      - atlassian-api-token
  # Outbound HTTP allowlist. Explicit [] is deny-all (fail-closed). List every
  # host your tools dial out to.
  allowedHosts:
    - "https://your-site.atlassian.net"
    - "https://api.atlassian.com"
