# wash v2 project configuration — used by Cosmonic Desktop's project mode
# (build + dev loop + promote) and by the `wash` CLI alike.
version: "0.1.0"
build:
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/web_fetch_mcp.wasm
# Mirrors WorkloadDeployment components[].localResources; carried over into
# the durable Workload draft when you promote this project.
workload:
  environment:
    config:
      RUST_LOG: info
  # Outbound HTTP allowlist. Egress is deny-by-default, so an empty list and an
  # omitted key both mean the component reaches nothing. This is the
  # egress boundary: the fetch_url tool reaches ONLY these hosts. Widen the
  # list to grant more.
  allowedHosts:
    - en.wikipedia.org
    - raw.githubusercontent.com
    - httpbin.org
