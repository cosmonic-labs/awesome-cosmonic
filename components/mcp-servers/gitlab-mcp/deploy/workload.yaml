# Cosmonic Desktop deployment manifest for the published gitlab-mcp image.
# Local iteration uses ../workload.yaml (Desktop's built-in registry); this
# manifest deploys the released image. Docs: https://cosmonic.com/docs/desktop
#
# Runs unauthenticated by default (public GitLab projects). To raise the rate
# limit and reach private projects, register a GitLab token as a Cosmonic secret
# and inject it as the GITLAB_TOKEN environment variable — see the README
# ("Optional: authenticate with a token"). The mechanism is the `secretFrom`
# block shown (commented) under localResources.environment below.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "gitlab-mcp"
  namespace: default
  labels:
    app.kubernetes.io/name: "gitlab-mcp"
    app.kubernetes.io/version: "0.1.0"
    "mcp.ai/auth-type": none
    mcp.ai/domain: "gitlab"
    "mcp.ai/function-type": tools
    "mcp.ai/spec-version": "2026-07-28"
    mcp.ai/statefulness: stateless
    mcp.ai/transport: "streamable-http"
  annotations:
    desktop.cosmonic.com/source: mcp
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      # wasi:http@0.3.0 (WASI p3): the single `handler` interface is this
      # component's ingress export — not the p2 `incoming-handler`.
      interfaces:
        - "handler"
      config:
        host: "gitlab-mcp.localhost.cosmonic.sh"
  components:
    - name: "gitlab-mcp"
      # Digest-pinned to the published 0.1.0 image. To deploy a locally
      # promoted build instead, use the digest-pinned
      # oci-registry.localhost:8200 reference that promote returns.
      image: "ghcr.io/cosmonic-labs/components/gitlab-mcp:0.1.0@sha256:64741b0b880f806230d93a14b7d6100289830cf37f5200247267ace0dcda5461"
      poolSize: 1
      maxInvocations: 0
      localResources:
        environment:
          config:
            RUST_LOG: info
            # DNS-rebinding guard: must list the ingress host(s) above.
            MCP_ALLOWED_HOSTS: "gitlab-mcp.localhost.cosmonic.sh,gitlab-mcp.localhost"
          # OPTIONAL authentication. Register a GitLab token as a Cosmonic
          # secret whose target env var is GITLAB_TOKEN, then uncomment this to
          # flatten it into the component's environment. Without it the server
          # runs unauthenticated. See the README for the `cosmonic_set_secret`
          # fields (name: gitlab-token, env: GITLAB_TOKEN).
          # secretFrom:
          #   - name: gitlab-token
        # Outbound allow-list — THE EGRESS BOUNDARY. The tools reach ONLY this
        # host; empty = deny-all. GitLab's entire REST API is under this host.
        allowedHosts:
          - gitlab.com
