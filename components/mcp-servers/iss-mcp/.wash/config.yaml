# wash v2 project configuration — used by Cosmonic Desktop's project mode
# (build + dev loop + promote) and by the `wash` CLI alike.
version: "0.1.0"
build:
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/iss_mcp.wasm
# Mirrors WorkloadDeployment components[].localResources; carried over into
# the durable Workload draft when you promote this project.
workload:
  environment:
    config:
      RUST_LOG: info
  # Outbound HTTP allowlist for `wash dev`. Read the default carefully: an
  # explicit `allowedHosts: []` is deny-all, but OMITTING the key entirely
  # means allow-all here (wash substitutes `Any`). That is the opposite of the
  # deployed manifest, where an absent key denies everything. Keep the key
  # present and list every host your tools dial out to.
  allowedHosts:
    - api.open-notify.org
