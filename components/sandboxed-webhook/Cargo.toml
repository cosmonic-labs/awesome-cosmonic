[package]
name = "sandboxed-webhook"
edition = "2024"
version = "0.1.0"
description = "A webhook receiver that verifies an HMAC signature then forwards to exactly one allow-listed host (deny-all egress). WebAssembly component: wasi:http, wasm32-wasip2."
license = "Apache-2.0"
repository = "https://github.com/cosmonic-labs/awesome-cosmonic"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_extern_crates = "warn"
trivial_numeric_casts = "warn"
unstable_features = "warn"
unused_import_braces = "warn"
unused-lifetimes = "warn"
unused-macro-rules = "warn"

[workspace.lints.clippy]
unwrap_used = 'deny'
expect_used = 'deny'
panic = 'deny'
indexing_slicing = 'deny'
dbg_macro = 'deny'
join_absolute_paths = 'deny'
needless_collect = 'deny'
option_env_unwrap = 'deny'
panicking_unwrap = 'deny'
serde_api_misuse = 'deny'
transmute_ptr_to_ref = 'deny'
transmute_undefined_repr = 'deny'
trivially_copy_pass_by_ref = 'deny'
uninit_vec = 'deny'
unnecessary_box_returns = 'deny'

[lib]
crate-type = ["cdylib"]

[dependencies]
# Async wasi:http standard library: serves incoming-handler via #[http_server]
# and calls outgoing-handler via Client; both compile to wasm32-wasip2.
wstd = "0.6"

# HMAC-SHA256 signature verification (constant-time). Pure Rust, no_std-friendly,
# compiles cleanly to wasm.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
