apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: kafka-transactional
  namespace: default
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [consumer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: "demo.events"
        consumer.group.id: "demo-txn-g1"
        auto.offset.reset: earliest
        enable.auto.commit: "false"
    - name: transaction
      namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [transaction]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: "demo.events,demo.enriched"
        # Each live replica needs a distinct stable ID.
        transactional.id: "demo-pipeline-txn-1"
        transaction.group.id: "demo-txn-g1"
  components:
    - name: pipeline
      # Prebuilt from this template on every push to main. Swap it for your
      # own registry once you change the source.
      image: ghcr.io/cosmonic-labs/kafka-templates/kafka-transactional:latest
      localResources:
        environment:
          config:
            IN_TOPIC: demo.events
            OUT_TOPIC: demo.enriched
            BATCH_SIZE: "1"
        allowedHosts: []
