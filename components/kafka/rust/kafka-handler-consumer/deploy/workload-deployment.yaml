apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: kafka-handler-consumer
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      components:
        - name: processor
          # Prebuilt from this template; swap for your own registry once you
          # change the source. Pin a `sha-<commit>` tag if you need one image.
          image: ghcr.io/cosmonic-labs/kafka-templates/kafka-handler-consumer:latest
          # Instances scale with assigned partition work and return to zero.
          poolSize: 32
          maxConcurrency: 1
          reclaimWindowSeconds: 30
          reclaimMinInstances: 0
      hostInterfaces:
        - namespace: cosmonic
          package: kafka
          version: 0.5.0
          interfaces: [handler]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            handler.topics: "demo.events"
            topics: "demo.events,demo.events.dlq"
            # This stable group resumes offsets across redeploys.
            handler.group.id: "demo-events-handler"
            auto.offset.reset: earliest
            dead-letter.topic: "demo.events.dlq"
            # Every group member must use the same assignment strategy.
            # partition.assignment.strategy: cooperative-sticky
