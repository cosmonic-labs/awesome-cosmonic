apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: kafka-handler-consumer
  namespace: default
spec:
  replicas: 1   # scale-out = more group members sharing the partitions
  template:
    spec:
      components:
        - name: consumer
          # Prebuilt from this template; swap for your own registry once you
          # change the source. Pin a `sha-<commit>` tag if you need one image.
          image: ghcr.io/cosmonic-labs/kafka-templates/kafka-handler-consumer:latest
          poolSize: 4
      hostInterfaces:
        - namespace: cosmonic
          package: kafka
          version: 0.3.0
          interfaces: [handler, types]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            # The subscription. `topics` is the separate produce/consume
            # grant, which a pure handler does not need.
            handler.topics: "demo.events"
            # Required, and stable across redeploys: it is what makes a
            # rolling update resume where the old replicas stopped.
            handler.group.id: "demo-events-handler"
            auto.offset.reset: earliest
            dead-letter.topic: "demo.events.dlq"
            # Cooperative by default, so scaling replicas moves only the
            # partitions that change hands. Every member of a group must
            # agree, so do not mix strategies across deployments that share
            # `handler.group.id`.
            # partition.assignment.strategy: cooperative-sticky
