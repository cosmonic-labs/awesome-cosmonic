apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: kafka-handler-consumer
  namespace: default
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [handler]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # The host subscribes to and dispatches these topics.
        handler.topics: "demo.events"
        # Grant the subscription and dead-letter topics.
        topics: "demo.events,demo.events.dlq"
        # This stable group resumes offsets across redeploys.
        handler.group.id: "demo-events-handler"
        auto.offset.reset: earliest
        dead-letter.topic: "demo.events.dlq"
        # The host also caps a batch near 1 MiB.
        # handler.batch.size: "100"
  components:
    - name: processor
      # Prebuilt from this template on every push to main. Swap it for your
      # own registry once you change the source.
      image: ghcr.io/cosmonic-labs/kafka-templates/kafka-handler-consumer:latest
      # Instances scale with assigned partition work and return to zero.
      poolSize: 32
      maxConcurrency: 1
      reclaimWindowSeconds: 30
      reclaimMinInstances: 0
      localResources:
        allowedHosts: []
