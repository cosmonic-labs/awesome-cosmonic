# Kubernetes (wasmCloud runtime-operator / Cosmonic Control) equivalent.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: http-kafka-producer
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      components:
        - name: producer
          # Prebuilt from this template; swap for your own registry once you
          # change the source. Pin a `sha-<commit>` tag if you need one image.
          image: ghcr.io/cosmonic-labs/kafka-templates/http-kafka-producer:latest
          poolSize: 4
      hostInterfaces:
        - namespace: wasi
          package: http
          version: 0.3.0
          interfaces: [incoming-handler]
          config:
            host: http-kafka-producer
        - namespace: cosmonic
          package: kafka
          version: 0.3.0
          interfaces: [producer, types]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            topics: "demo.events"
