apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: kafka-pull-service
  namespace: default
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.3.0
      interfaces: [consumer, producer, types]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # Grant every topic the service touches: input, output, and its DLQ.
        topics: "demo.events,demo.enriched,demo.events.dlq"
  components:
    - name: pipeline
      # Prebuilt from this template on every push to main. Swap it for your
      # own registry once you change the source.
      image: ghcr.io/cosmonic-labs/kafka-templates/kafka-pull-service:latest
      localResources:
        environment:
          config:
            IN_TOPIC: demo.events
            OUT_TOPIC: demo.enriched
            DLQ_TOPIC: demo.events.dlq
            GROUP_ID: demo-pipeline-g1
            BATCH_SIZE: "100"
        allowedHosts: []
