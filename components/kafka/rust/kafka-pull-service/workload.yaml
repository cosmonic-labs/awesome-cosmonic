apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: kafka-pull-service
  namespace: default
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [consumer, producer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # Grant every topic the service touches: input, output, and its DLQ.
        topics: "demo.events,demo.enriched,demo.events.dlq"
        consumer.group.id: "demo-pipeline-g1"
        auto.offset.reset: earliest
        enable.auto.commit: "false"
  service:
    image: ghcr.io/cosmonic-labs/kafka-templates/kafka-pull-service:latest
    maxRestarts: 100
    localResources:
      environment:
        config:
          IN_TOPIC: demo.events
          OUT_TOPIC: demo.enriched
          DLQ_TOPIC: demo.events.dlq
          BATCH_SIZE: "1"
      allowedHosts: []
  # Desktop currently requires one pooled component even for a service-only
  # workload. This copy is never invoked; only `service` drives wasi:cli/run.
  components:
    - name: desktop-validator-placeholder
      image: ghcr.io/cosmonic-labs/kafka-templates/kafka-pull-service:latest
      poolSize: 0
      localResources:
        allowedHosts: []
