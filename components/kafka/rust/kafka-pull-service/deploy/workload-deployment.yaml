apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: kafka-pull-service
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      service:
        # Prebuilt from this template; swap for your own registry once you
        # change the source. Pin a `sha-<commit>` tag if you need one image.
        image: ghcr.io/cosmonic-labs/kafka-templates/kafka-pull-service:latest
        maxRestarts: 100
        localResources:
          environment:
            config:
              IN_TOPIC: demo.events
              OUT_TOPIC: demo.enriched
              DLQ_TOPIC: demo.events.dlq
              BATCH_SIZE: "1"
      hostInterfaces:
        - namespace: cosmonic
          package: kafka
          version: 0.5.0
          interfaces: [consumer, producer]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            topics: "demo.events,demo.enriched,demo.events.dlq"
            consumer.group.id: "demo-pipeline-g1"
            auto.offset.reset: earliest
            enable.auto.commit: "false"
