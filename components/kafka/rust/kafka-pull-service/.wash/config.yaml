build:
  # The target is spelled out rather than left to `.cargo/config.toml`, so
  # this still builds a component if that file is edited or dropped.
  # wasm32-wasip2 is required: `cosmonic:kafka@0.5.0`'s functions are all
  # `async func`, which needs the p3 bindings wit-bindgen generates on top of
  # a p2 core module.
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/kafka_pull_service.wasm

dev:
  # wasi:cli/run components must be driven as services.
  service: true

workload:
  environment:
    config:
      IN_TOPIC: demo.events
      OUT_TOPIC: demo.enriched
      DLQ_TOPIC: demo.events.dlq
      BATCH_SIZE: "1"
  allowedHosts: []
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [consumer, producer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: "demo.events,demo.enriched,demo.events.dlq"
        consumer.group.id: "demo-pipeline-g1"
        auto.offset.reset: earliest
        enable.auto.commit: "false"
