# Cosmonic Desktop / wasmCloud v2 Workload.
#
# Apply from Cosmonic Desktop → Workloads → Run (paste it), or with the
# cosmonic_workload_apply MCP tool. For Cosmonic Control, apply
# deploy/workload-deployment.yaml instead.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: nats-request-reply
  namespace: default
spec:
  hostInterfaces:
    - namespace: wasmcloud
      package: nats
      version: "0.1.0"
      interfaces: [types, core, core-handler]
      config:
        subject-allow: demo.requests,_INBOX.>
        core-subscriptions: demo.requests
        max-in-flight: "8"
  components:
    - name: request-reply
      # Prebuilt from this template on every push to main. Swap it
      # for your own registry once you change the source.
      image: ghcr.io/cosmonic-labs/nats-templates/nats-request-reply:latest
      # Warm instances reused across deliveries. Reuse is a state
      # contract: package-level state survives, so treat it as a
      # cache. 0 or unset declares state ephemeral instead.
      poolSize: 1
      # Calls one instance serves before it is retired. 0 = unlimited.
      maxInvocations: 0
      localResources:
        # This component's own outbound-HTTP allowlist. Empty denies
        # every host; NATS flows through the binding, not HTTP.
        allowedHosts: []
