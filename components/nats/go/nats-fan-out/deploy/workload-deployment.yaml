# One manifest, both targets.
#
# Cosmonic Control takes a `WorkloadDeployment`, and Cosmonic Desktop 0.5.32+
# takes one too: it reads the workload out of the envelope and applies that,
# reporting what a single host cannot honour rather than dropping it. The
# image below is published from this repository and is pullable from either, so
# this file is the whole deployment story. On Desktop 0.5.31 and older, which
# answered `unsupported kind`, flatten it into a `Workload` first.
#
# The grants stay in the manifest. Under the `wasmcloud-nats` plugin's
# `workloadConfig`, which defaults to `deny` on Control, the operator declares
# a ceiling in the hostgroup's `hostPlugins` entry and a workload may ask for a
# subset of it. Three outcomes: narrowing a declared ceiling is accepted,
# asking for more than it is refused, and setting a key the operator declared
# no ceiling for is also refused. Check that third one before you apply this.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: nats-fan-out-go
  namespace: default
spec:
  # The operator's, and a cluster's. A single Desktop host runs one instance
  # and says so at apply; raise this for Control.
  replicas: 1
  template:
    spec:
      components:
        - name: fan-out
          # Prebuilt from this template on every push to main. Swap it
          # for your own registry once you change the source.
          image: ghcr.io/cosmonic-labs/nats-templates/nats-fan-out-go:latest
          # Warm instances reused across deliveries. Reuse is a state
          # contract: package-level state survives, so treat it as a
          # cache. 0 or unset declares state ephemeral instead.
          poolSize: 1
          # Calls one instance serves before it is retired. 0 = unlimited.
          maxInvocations: 0
          localResources:
            # This component's own outbound-HTTP allowlist. Empty denies
            # every host; NATS flows through the binding, not HTTP.
            allowedHosts: []
      hostInterfaces:
        - namespace: wasmcloud
          package: nats
          version: "0.1.0"
          interfaces: [types, core, core-handler]
          config:
            subject-allow: demo.events,demo.events.>
            core-subscriptions: demo.events
            max-in-flight: "8"
