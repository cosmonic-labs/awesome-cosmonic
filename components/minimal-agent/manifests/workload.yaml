# Workload for the minimal agent on a host that drives cosmonic:agent@0.4.0
# runs, such as Cosmonic Desktop.
#
# The agent component holds no egress (allowedHosts: []) and serves no HTTP.
# Everything it can do is listed under hostInterfaces: inference by alias, a
# session store and its tools, all served by the host and granted to the
# agent component alone.
#
# No entry names `run`. The agent exports it, and the host binds its own
# driver to that export: Cosmonic Desktop adds the binding to an agent
# session's workload itself and refuses a manifest that asks for it.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: minimal-agent
  namespace: default
spec:
  hostInterfaces:
    # The conversation: a host store bound to THIS workload. The agent names no
    # session, so it cannot reach another workload's, and the host deletes it
    # with the workload.
    - namespace: cosmonic
      package: agent
      version: 0.4.0
      interfaces:
        - session
      # Granted to the component named agent only, the way Desktop scopes its
      # agent sessions.
      config:
        components: agent
    # Inference. The agent asks for the alias "default"; this entry decides
    # what that means. Without a backend it uses the host's default model source.
    # The host serves cosmonic:agent from more than one plugin, so session,
    # inference and tools are declared as separate entries.
    - namespace: cosmonic
      package: agent
      version: 0.4.0
      interfaces:
        - inference-types
        - models
        - chat
      config:
        components: agent
        # backend: <one of the host's named model sources>
        # model: <a model on that source>
    # The agent's tools, served by the host. To link a tool component
    # directly instead, delete this entry and add a component that exports
    # cosmonic:agent/tools@0.4.0, with the hosts it may reach in its own
    # allowedHosts.
    - namespace: cosmonic
      package: agent
      version: 0.4.0
      interfaces:
        - tools
      config:
        components: agent
  components:
    - name: agent
      image: ghcr.io/cosmonic-labs/components/minimal-agent:0.3.0
      poolSize: 1
      localResources:
        allowedHosts: []
