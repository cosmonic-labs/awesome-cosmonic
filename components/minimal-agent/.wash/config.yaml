# wash v2 project configuration, used by Cosmonic Desktop's project mode and by
# the `wash` CLI alike.
version: "0.1.0"
build:
  # `wash build` fetches wit/deps first: cosmonic:agent from ghcr.io, pinned
  # by digest in wkg.lock.
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/minimal_agent.wasm
workload:
  # The agent holds no egress of its own: every model call goes through the
  # host's cosmonic:agent inference plugin. Explicit [] is deny-all. It
  # exports cosmonic:agent/run and no HTTP handler, so it needs no ingress.
  allowedHosts: []
