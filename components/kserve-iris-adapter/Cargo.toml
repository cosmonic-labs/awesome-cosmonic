[package]
name = "kserve-iris-adapter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wstd = "0.6"
http-body-util = "0.1"

[profile.release]
lto = true
opt-level = "s"
strip = true
