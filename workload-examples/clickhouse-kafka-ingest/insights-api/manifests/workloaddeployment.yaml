# Cosmonic Control deployment for the query half of the pipeline.
#
# The ClickHouse password comes from a Secret rather than the ConfigMap. The
# component reads it from the same `wasi:config/store` map either way, so the
# code is identical to the local run.
#
# Create the secret first:
#   kubectl create secret generic clickhouse-credentials \
#     --from-literal=CLICKHOUSE_PASSWORD='...'
apiVersion: v1
kind: Service
metadata:
  name: insights-api
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8001
      protocol: TCP
      nodePort: 30951
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insights-api-config
data:
  CLICKHOUSE_URL: http://clickhouse.data.svc.cluster.local:8123
  CLICKHOUSE_DATABASE: analytics
  CLICKHOUSE_USER: analytics
  REQUEST_TIMEOUT_MS: "10000"
  GATEWAY_URL: http://event-gateway.default.svc.cluster.local
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: insights-api
spec:
  replicas: 2
  template:
    spec:
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: insights-api
      components:
        - name: insights-api
          image: ghcr.io/example/insights-api:0.1.0
      hostInterfaces:
        # wasip3: the entrypoint is `handler` at 0.3.0, not p2's
        # `incoming-handler`.
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces:
            - handler
          config:
            host: "0.0.0.0"
            port: "8001"
        # `client` is p3's outbound interface, replacing p2's
        # `outgoing-handler`.
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces:
            - client
          config:
            allowedHosts: clickhouse.data.svc.cluster.local
        - namespace: wasi
          package: config
          interfaces:
            - store
          configFrom:
            - configMapRef:
                name: insights-api-config
          secretFrom:
            - secretRef:
                name: clickhouse-credentials
