# Cosmonic Desktop Workload spec for csv-tidy, matching the Launchpad entry.
#
# A WASI p3 component: it exports wasi:http/handler (not the p2
# incoming-handler), and imports only ambient WASI beyond that.
#
# There is deliberately no allowedHosts key. Egress is deny-by-default on this
# path, and this component makes no outbound calls. That matters for this tool
# in particular: the files people want to tidy are customer lists and bank
# exports, and the host enforces that none of it can leave.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: csv-tidy
  namespace: default
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      interfaces:
        - handler
      config:
        host: csv-tidy.localhost
  components:
    - name: csv-tidy
      image: ghcr.io/cosmonic-labs/components/csv-tidy:0.1.2@sha256:4c7e0cc11518336ac2af43e2bba47759d03b1e3b8dc0085b16ded7ef7a088066
      poolSize: 1
      maxInvocations: 0
