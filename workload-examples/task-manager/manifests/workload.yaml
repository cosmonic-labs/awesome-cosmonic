# Cosmonic Desktop Workload spec for task-manager, matching the Launchpad entry.
#
# A stateful component: it exports wasi:http/incoming-handler (WASI p2) and
# imports wasi:keyvalue/store, which Desktop provides with no configuration.
# Both are declared below, because a non-ambient import that is not declared
# fails to link rather than failing at first use.
#
# There is deliberately no allowedHosts key. Egress is deny-by-default, so the
# component reaches no network at all, and this example needs none: the task
# list lives in the host key-value store.
#
# Verified on Cosmonic Desktop 0.5.21 (wash-runtime 2.7.0): routes plus a full
# add, toggle and delete round-trip through the store. Needs Desktop >= 0.5.21,
# the release carrying wash-runtime 2.7.0.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: task-manager
  namespace: default
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      interfaces:
        - incoming-handler
      config:
        host: task-manager.localhost
    - namespace: wasi
      package: keyvalue
      interfaces:
        - store
  components:
    - name: task-manager
      # The published image, pinned by digest. To run a local build instead,
      # `wash build` then promote it and swap in the reference promote returns.
      image: ghcr.io/cosmonic-labs/components/task-manager:0.1.3@sha256:bf688bc7850c7a59b0bf0824e9d8066b62500fe849ce9602ea4b905135f0de06
      poolSize: 1
      maxInvocations: 0
