# wash v2 project configuration, used by Cosmonic Desktop's project mode
# (build, dev loop, promote) and by the `wash` CLI alike.
version: "0.1.3"
build:
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/task_manager.wasm
# Mirrors WorkloadDeployment components[].localResources; carried over into the
# durable Workload draft when you promote this project. Keep it in step with
# manifests/workload.yaml.
workload:
  # Explicit empty list: deny-all. This example makes no outbound calls at all,
  # because the task list persists to the host key-value store.
  #
  # The key has to be written out. Once a `workload:` block exists, omitting
  # allowedHosts makes `wash dev` substitute allow-all, which is the opposite of
  # the deployed manifest, where an absent key denies everything.
  allowedHosts: []
  environment:
    config:
      RUST_LOG: info
