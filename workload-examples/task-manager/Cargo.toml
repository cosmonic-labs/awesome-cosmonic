[package]
name = "task-manager"
edition = "2024"
version = "0.1.0"
description = "A to-do list that persists to the host key-value store — a stateful Wasm component for Cosmonic Desktop."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
